<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" aria-label="MediEase Clinic">
  <defs>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4B3"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="teal-deep" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="teal-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f766e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Base blob – main teal shape -->
  <path fill="url(#teal)" filter="url(#drop)"
        d="M 64 18
           C 92 18 108 42 108 64
           C 108 92 86 110 64 110
           C 42 110 20 92 20 64
           C 20 42 36 18 64 18 Z"/>

  <!-- Front overlapping form – emerald, organic curve -->
  <path fill="url(#teal-deep)"
        d="M 34 58
           C 34 38 50 22 64 26
           C 82 30 96 48 92 70
           C 88 90 66 102 48 94
           C 30 86 34 76 34 58 Z"/>

  <!-- Inner lighter blob – depth and glow -->
  <path fill="url(#teal-bright)"
        d="M 50 46
           C 58 40 72 44 78 56
           C 84 70 76 82 64 84
           C 50 86 42 72 44 58
           C 46 50 48 46 50 46 Z"/>

  <!-- Top highlight -->
  <path fill="url(#shine)"
        d="M 46 34
           C 54 28 66 32 70 40
           C 72 46 68 52 64 54
           C 56 56 46 50 46 42
           C 46 38 46 36 46 34 Z"/>

  <!-- Spark -->
  <ellipse cx="56" cy="46" rx="7" ry="5" fill="white" opacity="0.55"/>

  <!-- Medical plus – subtle healthcare cue -->
  <path fill="none" stroke="white" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round"
        d="M 64 72 L 64 98"/>
  <path fill="none" stroke="white" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round"
        d="M 54 85 L 74 85"/>
</svg>
